global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sglang
    static_configs:
      - targets: ["sglang-worker:30000"]
    metrics_path: /metrics

  - job_name: dynamo-frontend
    static_configs:
      - targets: ["dynamo-frontend:8000"]
    metrics_path: /metrics
