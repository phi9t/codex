# =============================================================================
# Full Dynamo + SGLang stack: frontend/router + SGLang worker + NATS + etcd
# =============================================================================
# Usage:
#   cp .env.example .env   # edit MODEL_NAME, HF_TOKEN as needed
#   docker compose up -d
#
# Then connect Codex:
#   CODEX_OSS_BASE_URL=http://localhost:8080/v1 codex --oss -m <MODEL_NAME>
#
# Or add a custom provider to ~/.codex/config.toml — see codex-config/config.toml.example

services:
  # ---------------------------------------------------------------------------
  # Discovery plane: etcd (single-node, no auth for local dev)
  # ---------------------------------------------------------------------------
  etcd:
    image: bitnami/etcd:3.5
    user: "1001:1001"
    security_opt:
      - no-new-privileges:true
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "${ETCD_PORT:-2379}:2379"
    volumes:
      - etcd-data:/bitnami/etcd
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
        reservations:
          memory: 256m
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Event plane: NATS with JetStream
  # ---------------------------------------------------------------------------
  nats:
    image: nats:2.10
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    command: ["--js", "--sd", "/data/nats", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      # Monitor port 8222 is intentionally not exposed on the host —
      # Prometheus scrapes it via the internal Docker network.
    volumes:
      - nats-data:/data/nats
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2"
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SGLang inference worker (GPU required)
  # ---------------------------------------------------------------------------
  sglang-worker:
    image: lmsysorg/sglang:${SGLANG_IMAGE_TAG:-v0.4.6}
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - NATS_SERVER=nats://nats:4222
      - ETCD_ENDPOINTS=http://etcd:2379
    command: >
      python3 -m sglang.launch_server
        --model-path ${MODEL_NAME:-Qwen/Qwen2.5-Coder-7B-Instruct}
        --host 0.0.0.0
        --port ${SGLANG_PORT:-30000}
        --tp ${TENSOR_PARALLEL_SIZE:-1}
        --mem-fraction-static ${SGLANG_MEM_FRACTION:-0.85}
        --max-running-requests ${SGLANG_MAX_RUNNING_REQUESTS:-64}
        --chunked-prefill-size ${SGLANG_CHUNKED_PREFILL_SIZE:-8192}
        --enable-priority-scheduling
        --radix-eviction-policy ${SGLANG_RADIX_EVICTION_POLICY:-priority}
        --enable-hierarchical-cache
        --hicache-write-policy ${SGLANG_HICACHE_WRITE_POLICY:-write_through}
        --tool-call-parser ${SGLANG_TOOL_CALL_PARSER:-qwen25}
        --watchdog-timeout ${SGLANG_WATCHDOG_TIMEOUT:-300}
        --enable-metrics
    ipc: host
    shm_size: "32g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${TENSOR_PARALLEL_SIZE:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${SGLANG_PORT:-30000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 120
      start_period: 300s
    depends_on:
      etcd:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Dynamo frontend + router
  # ---------------------------------------------------------------------------
  dynamo-frontend:
    image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.0.1
    security_opt:
      - no-new-privileges:true
    ports:
      - "${DYNAMO_FRONTEND_PORT:-8080}:8000"
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: "4"
        reservations:
          memory: 4g
          cpus: "2"
    environment:
      - NATS_SERVER=nats://nats:4222
      - ETCD_ENDPOINTS=http://etcd:2379
      - SGLANG_WORKER_URL=http://sglang-worker:${SGLANG_PORT:-30000}
      - MODEL_NAME=${MODEL_NAME:-Qwen/Qwen2.5-Coder-7B-Instruct}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      sglang-worker:
        condition: service_healthy
      nats:
        condition: service_healthy
      etcd:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: codex-infra

volumes:
  etcd-data:
  nats-data:
  hf-cache:
