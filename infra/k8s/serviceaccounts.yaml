# =============================================================================
# Dedicated ServiceAccounts for each workload in codex-inference.
#
# None of these workloads need Kubernetes API access, so:
#   - automountServiceAccountToken: false  (no bearer token injected into pods)
#   - No RBAC roles or bindings (only Prometheus has API access, managed in
#     monitoring/prometheus.yaml)
#
# Each component gets its own SA so future RBAC grants can be scoped precisely.
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/part-of: codex-inference
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nats
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: codex-inference
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sglang-worker
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: sglang-worker
    app.kubernetes.io/part-of: codex-inference
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dynamo-frontend
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: dynamo-frontend
    app.kubernetes.io/part-of: codex-inference
automountServiceAccountToken: false
