apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: codex-inference
spec:
  serviceName: nats-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: codex-inference
    spec:
      containers:
        - name: nats
          image: nats:2.10
          args:
            - "--js"
            - "--sd"
            - "/data/nats"
            - "-m"
            - "8222"
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          startupProbe:
            httpGet:
              path: /healthz
              port: monitor
            failureThreshold: 18
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: nats-data
              mountPath: /data/nats
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: nats-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
