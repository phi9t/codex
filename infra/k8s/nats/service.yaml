# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: codex-inference
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
    - name: monitor
      port: 8222
---
# ClusterIP service for client access
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: codex-inference
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
    - name: monitor
      port: 8222
