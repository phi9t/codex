# Native Kubernetes Prometheus deployment for scraping SGLang and Dynamo metrics.
# Uses kubernetes_sd_configs to discover services annotated with:
#   prometheus.io/scrape: "true"
#   prometheus.io/port: "<port>"
#   prometheus.io/path: "<path>"   (defaults to /metrics)
#
# No CRDs or operators required — all standard Kubernetes objects.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: codex-inference
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # Discover services in the codex-inference namespace that have
      # prometheus.io/scrape: "true" on their Service metadata.
      - job_name: codex-inference-services
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names: [codex-inference]
        relabel_configs:
          # Drop services without the scrape annotation
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # Use the port from the annotation when present
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+?)(?::\d+)?;(\d+)
            replacement: $1:$2
          # Use the path from the annotation when present
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Carry useful labels through
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
            target_label: job
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: codex-inference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: codex-inference
rules:
  - apiGroups: [""]
    resources: [services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: codex-inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: codex-inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: codex-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: codex-inference
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=7d"
            - "--web.enable-lifecycle"
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: codex-inference
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: codex-inference
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
