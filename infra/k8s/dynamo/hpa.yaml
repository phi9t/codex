apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dynamo-frontend-hpa
  namespace: codex-inference
  labels:
    app.kubernetes.io/name: dynamo-frontend
    app.kubernetes.io/part-of: codex-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dynamo-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
